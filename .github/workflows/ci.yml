name: ci

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "*.md"
  pull_request:
    # Include `ready_for_review` alongside the defaults so marking a draft PR
    # ready fires the workflow — otherwise the draft-skipped jobs (see the `if`
    # guards below) never run once it becomes ready. Specifying `types` replaces
    # the default set, so the defaults are listed explicitly.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always
  # Tracks the `diesel` crate the server builds against.
  DIESEL_CLI_VERSION: 2.3.11

jobs:
  rust:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}-cargo

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  # PostgreSQL is the only storage backend, so its tests have to actually run.
  # They can't join the `rust` matrix: that includes a macOS runner, which has no
  # PostgreSQL service. Hence a third job, and a `pg-tests` feature so the plain
  # `cargo test` there doesn't even compile this target.
  storage-pg:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ubuntu-latest-cargo

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install diesel_cli
        run: cargo binstall --no-confirm "diesel_cli@$DIESEL_CLI_VERSION"

      # Its own empty database: migrating the storage-test one would say nothing
      # about what a fresh deployment gets. `diesel setup`/`database reset` are
      # avoided — they scaffold an untracked `diesel_initial_setup` migration
      # into the checkout.
      - name: Check schema.rs matches the migrations
        working-directory: app/coda_server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/coda_schema_check
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 -c 'create database coda_schema_check;'
          diesel migration run --locked-schema

      # No `DATABASE_URL` makes this fail rather than skip: a suite that skips
      # itself would leave persistence untested while the job still went green.
      - name: Storage tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/coda_test
        run: cargo test -p coda_server --features pg-tests --test storage_pg

  web:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter coda-web lint

      - name: Format check
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter coda-web typecheck
