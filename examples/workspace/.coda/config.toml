# Tool approval rules for this workspace.
#
# The baseline is the session's permission mode, picked in the composer:
#
#   explore       ls, read_file, glob, grep, read_todos, write_todos
#   accept_edits  the above plus write_file, edit_file   (the default)
#   yolo          everything, shell included
#
# Anything the mode does not cover pauses for approval, so this file is only
# for tightening further.
#
# `approval_required` lists tool-name patterns that pause for approval under
# *every* mode — yolo included. It defaults to empty. Use `mcp__server__*` to
# cover every tool from one MCP server.
# `ask_user` is always interactive and always pauses to open the UI.
#
# Shell commands use allow/deny globs. Under yolo the allow-list is skipped and
# only `deny` is consulted. Otherwise a command is parsed and split into its
# simple commands (on `;`, newlines, `&&`, `||`, `|`); each is evaluated
# independently. The whole call auto-approves only when:
#   - every simple command matches an `allow` pattern, and
#   - no simple command matches a `deny` pattern (deny wins over allow), and
#   - it uses only sequencing/pipe operators — anything that can't be statically
#     vetted (backgrounding `&`, redirections `>`/`<`, command substitution
#     `$(...)`/backticks, subshells/loops/`if`, or a parse error) falls back to
#     requiring approval (the safe default).
#
# Patterns are globs matched against each simple command's text.

[permissions.tools]
# Kept behind a human even in yolo — this server's tools reach outside the
# workspace, which no mode should be able to wave through.
approval_required = [
  "mcp__time__*",
]

[permissions.shell]
allow = [
  "ls *",
  "cat *",
  "git status",
  "git diff *",
  "cargo build",
  "cargo test *",
]
deny = [
  "rm -rf *",
  "git push *",
]
