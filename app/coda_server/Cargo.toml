[package]
name = "coda_server"
version = "0.1.0"
edition = "2024"

[dependencies]
coda_core = { workspace = true }
coda_mcp = { workspace = true }
coda_openai = { workspace = true }
coda_agent = { workspace = true }
coda_skills = { workspace = true }
coda_tools = { workspace = true }
jiff = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = "0.0.12"
schemars = { workspace = true }
toml_edit = "0.25"
axum = { version = "0.8", features = ["ws"] }
brush-parser = "0.4.0"
clap = { version = "4", features = ["derive", "env"] }
uuid = { workspace = true }
# `postgres_backend`, not `postgres`: the latter pulls `pq-sys` and links libpq.
# diesel-async talks to PostgreSQL through tokio-postgres, so the C library is
# only ever needed by `diesel print-schema`, never by a build of this crate.
diesel = { version = "2.3", default-features = false, features = [
  "postgres_backend",
  "serde_json",
  "uuid",
] }
# Timestamps stay on jiff end to end; this supplies the `Timestamptz` codec that
# the orphan rule keeps out of jiff itself. Its `postgres` feature is the same
# libpq-free `diesel/postgres_backend` this crate already uses.
jiff-diesel = { version = "0.1", default-features = false, features = ["postgres"] }
diesel-async = { version = "0.9", default-features = false, features = [
  "postgres",
  "deadpool",
  # Supplies `AsyncMigrationHarness`, which runs the embedded migrations over an
  # async connection. It uses `block_in_place`, so callers need a multi-threaded
  # runtime — the server has one; tests have to ask for it.
  "migrations",
] }
diesel_migrations = "2.3"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

# The PostgreSQL storage tests need a live database, so they live in their own
# test target gated behind this feature — `cargo test` must stay green on a
# machine without PostgreSQL (the CI matrix includes macOS runners, which have
# none). The `storage-pg` CI job turns it on. Merely putting the tests under
# `tests/` would not be enough: `cargo test` builds and runs every target there.
#
# Note the tests must run on a multi-threaded runtime (`#[tokio::test(flavor =
# "multi_thread")]`): applying migrations goes through `block_in_place`.
[features]
pg-tests = []

[[test]]
name = "storage_pg"
required-features = ["pg-tests"]

[[bin]]
name = "coda-server"
path = "src/bin/server.rs"
