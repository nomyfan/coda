[package]
name = "coda_server"
version = "0.1.0"
edition = "2024"

[dependencies]
coda_core = { workspace = true }
coda_mcp = { workspace = true }
coda_openai = { workspace = true }
coda_agent = { workspace = true }
coda_skills = { workspace = true }
coda_tools = { workspace = true }
jiff = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = "0.0.12"
schemars = { workspace = true }
toml_edit = "0.25"
axum = { version = "0.8", features = ["ws"] }
brush-parser = "0.4.0"
clap = { version = "4", features = ["derive", "env"] }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  # `macros` is here only for `sqlx::migrate!`, which embeds the migration files
  # at compile time. The query macros (which would need a live database to
  # build) are deliberately unused; every statement is built with the runtime
  # API instead, so a checkout compiles without PostgreSQL.
  "macros",
  "json",
  "uuid",
  "chrono",
  "migrate",
] }

[dev-dependencies]
tempfile = "3"

# The PostgreSQL storage tests need a live database, so they live in their own
# test target gated behind this feature — `cargo test` must stay green on a
# machine without PostgreSQL (the CI matrix includes macOS runners, which have
# none). The `storage-pg` CI job turns it on. Merely putting the tests under
# `tests/` would not be enough: `cargo test` builds and runs every target there.
[features]
pg-tests = []

[[test]]
name = "storage_pg"
required-features = ["pg-tests"]

[[bin]]
name = "coda-server"
path = "src/bin/server.rs"
